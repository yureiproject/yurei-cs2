function sampleMapInfo(name){let i=maps.indexOf(name);return {win:[62,57,54,49,46,51][i]||50,matches:[24,19,17,14,11,13][i]||0,strats:[{name:'Default contrôle mid',side:'T',detail:'Prendre l’information mid, garder un lurk B et finir A après le contrôle connecteur.'},{name:'Exécution A rapide',side:'T',detail:'Smoke jungle + stairs, flash ramp puis entrée groupée par A ramp.'},{name:'Reprise site B',side:'CT',detail:'Jouer le retake ensemble depuis market et short, attendre la smoke window.'}],lineups:[{name:'Smoke jungle depuis T spawn',utility:'Smoke',side:'T',detail:'Alignement: coin du mur à gauche de la sortie. Lancer debout, clic gauche.'},{name:'Flash pop A ramp',utility:'Flash',side:'T',detail:'Lancer au-dessus du rebord au signal de l’entry.'}],callouts:['A ramp','Palace','Ticket','Jungle','Connector','Window','Top mid','Market','B apps','Bench']}}
function mapPage(){return `${heading('Maps','Performances, stratégies, lineups et callouts de l’équipe.') }<div class="grid mapgrid">${maps.map((m,i)=>{let s=sampleMapInfo(m);return `<article class="card mapcard" data-mark="${m.slice(0,1)}"><div class="maptop"><span class="badge ${i<3?'green':'yellow'}">${i<3?'POOL ACTIF':'À TRAVAILLER'}</span><button class="btn sm" data-map="${m}">Ouvrir ↗</button></div><div class="mapname">${m}</div><div class="mapmeta">${i<3?'Pool compétitif':'Map de réserve'}</div><div class="mapstats"><div><b>${s.win}%</b><small>WIN RATE*</small></div><div><b>${s.matches}</b><small>MATCHS*</small></div><div><b>${s.strats.length+(data.mapNotes[m]?.strats?.length||0)}</b><small>STRATS</small></div></div></article>`}).join('')}</div><div class="hint">* Statistiques de démonstration. Les strats et lineups que tu ajoutes sont sauvegardés sur cet appareil.</div>`}
function mapModal(name,tab='strats'){let info=sampleMapInfo(name),extra=data.mapNotes[name]||{strats:[],lineups:[],callouts:[]};let content=tab==='overview'?`<div class="grid stats">${stat('WIN RATE*',info.win+'%','Données de démonstration','↗')}${stat('MATCHS*',info.matches,'Historique exemple','▤')}${stat('STRATS',info.strats.length+extra.strats.length,'T + CT','◈')}${stat('CALLOUTS',info.callouts.length+extra.callouts.length,'Repères de map','⌖')}</div>`:tab==='callouts'?`<div class="row" style="flex-wrap:wrap">${[...info.callouts,...extra.callouts].map(x=>`<span class="badge blue" style="padding:8px 10px">${esc(x)}</span>`).join('')}</div>`:`<div class="grid" style="gap:9px">${(tab==='strats'?[...info.strats,...extra.strats]:[...info.lineups,...extra.lineups]).map(x=>`<div class="card"><div class="sectionhead"><b>${esc(x.name)}</b><span class="badge ${x.side==='T'?'red':x.side==='CT'?'blue':'yellow'}">${esc(x.side||x.utility||'ÉQUIPE')}</span></div><div class="sub">${esc(x.detail||'')}</div></div>`).join('')||'<div class="empty">Aucun élément pour le moment.</div>'}</div>`;$('#modal').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">CS2 · GUIDE D’ÉQUIPE</div><h2 style="margin:3px 0 0">${esc(name)}</h2></div><button class="btn" data-close>Fermer</button></div><div class="tabs detail-tabs">${[['overview','Aperçu'],['strats','Strats'],['lineups','Lineups'],['callouts','Callouts']].map(([k,t])=>`<button data-map-tab="${k}" class="${tab===k?'active':''}">${t}</button>`).join('')}</div><div style="margin-top:15px">${content}</div><div class="modalfoot" style="justify-content:space-between"><span class="muted" style="font-size:10px">Les données exemples sont signalées par *</span>${tab==='callouts'?'':`<button class="btn primary" data-map-add="${tab}">＋ Ajouter ${tab==='strats'?'une strat':'un lineup'}</button>`}<button class="btn" data-map-add="callouts">＋ Callout</button></div>`;$('#overlay').classList.add('show');$('#modal').querySelector('[data-close]').onclick=closeModal;$('#modal').querySelectorAll('[data-map-tab]').forEach(b=>b.onclick=()=>mapModal(name,b.dataset.mapTab));$('#modal').querySelectorAll('[data-map-add]').forEach(b=>b.onclick=()=>addMapItem(name,b.dataset.mapAdd))}
function addMapItem(name,type){if(type==='callouts'){showModal('Ajouter un callout',`<div class="field"><label>NOM DU CALLOUT</label><input id="mapName" placeholder="Ex. Short"></div>`,m=>{let v=m.querySelector('#mapName').value.trim();if(!v)return;data.mapNotes[name]??={strats:[],lineups:[],callouts:[]};data.mapNotes[name].callouts.push(v);save();mapModal(name,'callouts')});return}showModal(type==='strats'?'Ajouter une strat':'Ajouter un lineup',`<div class="field"><label>NOM</label><input id="mapItemName" placeholder="Ex. Exécution B"></div><div class="row"><div class="field" style="flex:1"><label>CAMP</label><select id="mapSide"><option>T</option><option>CT</option></select></div><div class="field" style="flex:1"><label>UTILITAIRE (LINEUP)</label><select id="mapUtility"><option>Smoke</option><option>Flash</option><option>Molotov</option><option>HE</option></select></div></div><div class="field"><label>DESCRIPTION / ALIGNEMENT</label><textarea id="mapDetail" rows="3" placeholder="Décris les étapes et le timing"></textarea></div>`,m=>{let n=m.querySelector('#mapItemName').value.trim();if(!n)return;data.mapNotes[name]??={strats:[],lineups:[],callouts:[]};data.mapNotes[name][type].push({name:n,side:m.querySelector('#mapSide').value,utility:m.querySelector('#mapUtility').value,detail:m.querySelector('#mapDetail').value.trim()});save();mapModal(name,type)})}
function playerModal(id){let p=player(id),notes=data.playerNotes[id]||{};let mapRows=maps.map((m,i)=>`<div class="match"><span>${m}</span><span class="muted">${[1.22,1.09,1.04,.96,.93,1.01][i]} K/D · ${[68,56,54,49,45,51][i]}% win*</span></div>`).join('');$('#modal').innerHTML=`<div class="sectionhead"><div class="row"><span class="avatar" style="background:${p.color};width:42px;height:42px">${p.initial}</span><div><div class="eyebrow">PROFIL JOUEUR</div><h2 style="margin:2px 0">${esc(p.name)}</h2><span class="muted">${esc(notes.role||p.role)}</span></div></div><button class="btn" data-close>Fermer</button></div><div class="grid stats" style="grid-template-columns:repeat(3,1fr)">${stat('FACEIT ELO',p.elo,'Démonstration','◉')}${stat('K/D',p.kd,'Démonstration','◎')}${stat('WIN RATE',p.win,'Démonstration','↗')}</div><div class="card"><div class="sectionhead"><h2>Statistiques par map*</h2></div>${mapRows}</div><div class="card" style="margin-top:12px"><div class="sectionhead"><h2>Matchs récents</h2></div>${sampleMatchRows().slice(0,3).map(x=>`<div class="match"><span>${esc(x.team)} · ${esc(x.map)}</span><b>${x.ours} – ${x.theirs}</b></div>`).join('')}</div><div class="hint">* Statistiques de démonstration. Le rôle éditable est enregistré localement.</div><div class="modalfoot"><button class="btn primary" data-edit-player="${id}">Modifier le rôle</button><button class="btn" data-set-profile="${id}">Définir comme profil actif</button></div>`;$('#overlay').classList.add('show');$('#modal').querySelector('[data-close]').onclick=closeModal;$('#modal').querySelector('[data-set-profile]').onclick=()=>{data.profile=id;save();renderNav();closeModal();toast('Profil actif mis à jour')};$('#modal').querySelector('[data-edit-player]').onclick=()=>showModal('Modifier le rôle',`<div class="field"><label>RÔLE</label><input id="playerRole" value="${esc(notes.role||p.role)}"></div>`,m=>{data.playerNotes[id]??={};data.playerNotes[id].role=m.querySelector('#playerRole').value.trim()||p.role;save();playerModal(id)})}
function playerPage(){return `${heading('Joueurs','Profils, rôles, statistiques par map et historique.') }<div class="grid players">${players.map(p=>`<article class="card player"><div class="playerbanner"></div><div class="playerbody"><div class="playeravatar" style="background:${p.color}">${p.initial}</div><div class="playername">${esc(p.name)}</div><div class="role">${esc(data.playerNotes[p.id]?.role||p.role)}</div><div class="pstats"><div><b>${p.elo}</b><small>ELO*</small></div><div><b>${p.kd}</b><small>K/D*</small></div><div><b>${p.win}</b><small>WIN*</small></div></div><button class="btn sm" style="width:100%;margin-top:13px" data-profile="${p.id}">Ouvrir le profil</button></div></article>`).join('')}</div><div class="hint">* Statistiques d’exemple, modifiables lorsque les intégrations seront ajoutées.</div>`}
function training(){let base=[['Échauffement aim','Aim Botz','10'],['Précision & flicks','Workshop · Aim Training','15'],['Spray control','Recoil Master','15'],['Deathmatch','Valve DM · HS only','20']];let rows=[...base.map((x,i)=>({id:'base-'+i,name:x[0],tool:x[1],minutes:x[2],url:''})),...data.exercises];return `${heading('Training','Routine, exercices personnalisés et séances d’équipe.',`<button class="btn" data-action="new-exercise">＋ Ajouter un exercice</button> <button class="btn primary" data-action="new-event">＋ Planifier</button>`)}<div class="grid cols"><div class="card"><div class="sectionhead"><h2>Routine d’entraînement</h2><span class="badge blue">${rows.reduce((a,x)=>a+Number(x.minutes||0),0)} MIN</span></div>${rows.map((x,i)=>`<div class="match"><div class="opponent"><span class="oplogo" style="color:#f1787e">${String(i+1).padStart(2,'0')}</span><div>${esc(x.name)}<small>${esc(x.tool)}${x.url?` · <a href="${esc(x.url)}" target="_blank" rel="noopener">Ouvrir Workshop ↗</a>`:''}</small></div></div><span class="muted">${esc(x.minutes)} min</span>${x.id.startsWith('user-')?`<button class="btn sm" data-delete-exercise="${x.id}">×</button>`:''}</div>`).join('')}<button class="btn" style="margin-top:12px" data-action="new-exercise">＋ Créer un exercice</button></div><div class="card"><div class="sectionhead"><h2>Séances à venir</h2><span class="badge red">CETTE SEMAINE</span></div>${eventRows()}<button class="btn" style="margin-top:12px" data-page="Plannings">Ouvrir le planning →</button></div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Focus joueur</h2><span class="muted">Ouvrir le profil pour voir ses stats</span></div><div class="row" style="gap:9px;flex-wrap:wrap">${players.map(p=>`<button class="btn" data-training="${p.id}">${p.initial} · ${p.name} · ${esc(data.playerNotes[p.id]?.role||p.role)}</button>`).join('')}</div></div>`}
function addExercise(){showModal('Ajouter un exercice',`<div class="field"><label>NOM DE L’EXERCICE</label><input id="exName" placeholder="Ex. Counter-strafe"></div><div class="row"><div class="field" style="flex:1"><label>OUTIL / WORKSHOP</label><input id="exTool" placeholder="Ex. Aim Botz"></div><div class="field" style="width:100px"><label>DURÉE (MIN)</label><input id="exMinutes" type="number" min="1" max="240" value="15"></div></div><div class="field"><label>LIEN WORKSHOP (OPTIONNEL)</label><input id="exUrl" type="url" placeholder="https://steamcommunity.com/sharedfiles/filedetails/?id=…"></div>`,m=>{let name=m.querySelector('#exName').value.trim();if(!name){toast('Ajoute un nom d’exercice');return}let url=m.querySelector('#exUrl').value.trim();if(url&&!/^https:\/\//i.test(url)){toast('Le lien doit commencer par https://');return}data.exercises.push({id:'user-'+Date.now(),name,tool:m.querySelector('#exTool').value.trim()||'Exercice personnalisé',minutes:String(Math.max(1,Number(m.querySelector('#exMinutes').value)||15)),url});save();renderPage();toast('Exercice ajouté à la routine')})}
function matches(){let rows=sampleMatchRows();return `${heading('Matchs','Historique, scoreboards et démos de la team.',`<button class="btn primary" data-action="new-match">＋ Ajouter un match</button>`)}<div class="card"><div class="sectionhead"><h2>Historique des matchs</h2><div class="row"><input class="search" id="matchSearch" placeholder="⌕ Rechercher une équipe…"><select id="matchFilter" class="search"><option value="all">Tous les résultats</option><option value="win">Victoires</option><option value="loss">Défaites</option></select></div></div><div id="matchList">${rows.map(x=>`<button class="match match-button" data-match="${esc(x.id)}" data-result="${x.result}" data-kind="${x.type||'CS2'}" data-search="${esc(x.team.toLowerCase())}"><div class="opponent"><span class="oplogo">${esc(x.team.split(' ').map(w=>w[0]).join(''))}</span><div>${esc(x.team)}<small>${esc(x.map)} · ${esc(x.date)} · ${esc(x.format||'BO1')}</small></div></div><div class="row"><b style="font:700 18px 'Barlow Condensed'">${x.ours} – ${x.theirs}</b><span class="badge ${x.result==='win'?'green':x.result==='draw'?'yellow':'red'}">${x.result==='win'?'VICTOIRE':x.result==='draw'?'NUL':'DÉFAITE'}</span></div></button>`).join('')||'<div class="empty">Aucun match enregistré.</div>'}</div></div>`}
function newMatch(){showModal('Ajouter un match',`<div class="field"><label>ADVERSAIRE</label><input id="opponent" placeholder="Nom de l’équipe" required></div><div class="row"><div class="field" style="flex:1"><label>MAP</label><select id="matchMap">${maps.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field" style="flex:1"><label>FORMAT</label><select id="matchFormat"><option>BO1</option><option>BO3</option><option>BO5</option></select></div></div><div class="row"><div class="field" style="flex:1"><label>NOTRE SCORE</label><input id="scoreUs" type="number" min="0" value="13"></div><div class="field" style="flex:1"><label>SCORE ADVERSE</label><input id="scoreThem" type="number" min="0" value="8"></div><div class="field" style="flex:1"><label>DATE</label><input id="matchDate" type="date" value="${keyDate(new Date())}"></div></div><div class="field"><label>LIEN DE DÉMO (OPTIONNEL)</label><input id="matchDemo" type="url" placeholder="https://…"></div>`,m=>{let team=m.querySelector('#opponent').value.trim();if(!team){toast('Indique le nom de l’adversaire');return}let u=Number(m.querySelector('#scoreUs').value)||0,t=Number(m.querySelector('#scoreThem').value)||0,url=m.querySelector('#matchDemo').value.trim();if(url&&!/^https:\/\//i.test(url)){toast('Le lien de démo doit commencer par https://');return}data.matches.unshift({id:'match-'+Date.now(),team,map:m.querySelector('#matchMap').value,format:m.querySelector('#matchFormat').value,ours:u,theirs:t,date:m.querySelector('#matchDate').value,result:u>t?'win':u<t?'loss':'draw',demo:url});save();renderPage();toast('Match enregistré')})}
function matchModal(id){let m=sampleMatchRows().find(x=>x.id===id);if(!m)return;let stats=players.map((p,i)=>({p,k:[21,18,17,14,19][i],d:[14,13,16,12,15][i],a:[5,7,4,9,6][i],adr:[87,79,76,64,82][i]}));$('#modal').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">${esc(m.format||'BO1')} · ${esc(m.map)} · ${esc(m.date)}</div><h2 style="margin:4px 0">Yurei <span class="muted">${m.ours} – ${m.theirs}</span> ${esc(m.team)}</h2><span class="badge ${m.result==='win'?'green':m.result==='draw'?'yellow':'red'}">${m.result==='win'?'VICTOIRE':m.result==='draw'?'NUL':'DÉFAITE'}</span></div><button class="btn" data-close>Fermer</button></div><div class="card" style="margin-top:14px;overflow:auto"><div class="sectionhead"><h2>Scoreboard</h2><span class="muted">Données de match exemple</span></div><table class="scoretable"><thead><tr><th>JOUEUR</th><th>K</th><th>D</th><th>A</th><th>ADR</th><th>K/D</th></tr></thead><tbody>${stats.map(x=>`<tr><td>${esc(x.p.name)} · ${esc(x.p.role)}</td><td>${x.k}</td><td>${x.d}</td><td>${x.a}</td><td>${x.adr}</td><td>${(x.k/x.d).toFixed(2)}</td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:12px"><div class="sectionhead"><h2>Démo</h2></div>${m.demo?`<a class="btn primary" href="${esc(m.demo)}" target="_blank" rel="noopener">Ouvrir le lien de démo ↗</a>`:'<span class="muted">Aucun lien de démo ajouté pour ce match.</span>'}</div><div class="hint">Les scoreboards des matchs exemples sont fictifs. Les matchs que tu ajoutes sont sauvegardés localement.</div>`;$('#overlay').classList.add('show');$('#modal').querySelector('[data-close]').onclick=closeModal}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-action="new-event"]').forEach(b=>b.onclick=()=>eventModal());document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{data.view=b.dataset.view;save();renderPage()});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{weekOffset=b.dataset.week==='0'?0:weekOffset+Number(b.dataset.week);renderPage()});document.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>{if(data.view!=='mine')return;let k=el.dataset.slot,s=data.availability[k]||'off';data.availability[k]=s==='off'?'yes':s==='yes'?'maybe':s==='maybe'?'no':'off';save();renderPage()});document.querySelectorAll('[data-event]').forEach(el=>el.onclick=()=>eventModal(data.events.find(e=>e.id===el.dataset.event)));$('#availabilityPlayer')?.addEventListener('change',e=>{data.profile=e.target.value;save();renderNav();renderPage()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>playerModal(b.dataset.profile));document.querySelectorAll('[data-training]').forEach(b=>b.onclick=()=>playerModal(b.dataset.training));document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>mapModal(b.dataset.map));$('#matchSearch')?.addEventListener('input',filterMatches);$('#matchFilter')?.addEventListener('change',filterMatches);document.querySelector('[data-action="new-match"]')?.addEventListener('click',newMatch);document.querySelector('[data-action="new-exercise"]')?.addEventListener('click',addExercise);document.querySelectorAll('[data-delete-exercise]').forEach(b=>b.onclick=()=>{data.exercises=data.exercises.filter(x=>x.id!==b.dataset.deleteExercise);save();renderPage();toast('Exercice supprimé')});document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>matchModal(b.dataset.match))}
function renderPage(){ensureData();let f={Accueil:home,Plannings:schedule,Joueurs:playerPage,Maps:mapPage,Training:training,Matchs:matches,FACEIT:faceit};$('#page').innerHTML=f[page]();bind()}
function filterMatches(){let q=$('#matchSearch').value.toLowerCase(),f=$('#matchFilter').value;document.querySelectorAll('#matchList [data-match]').forEach(el=>el.style.display=(el.dataset.search.includes(q)&&(f==='all'||el.dataset.result===f))?'flex':'none')}
function openProfile(){showModal('Profil actif',`<div class="field"><label>QUI UTILISE L’APPLICATION ?</label><select id="profileSelect">${players.map(p=>`<option value="${p.id}" ${p.id===data.profile?'selected':''}>${p.name} · ${data.playerNotes?.[p.id]?.role||p.role}</option>`).join('')}</select></div><div class="sub">Le profil choisi contrôle « Mes disponibilités » et reste enregistré sur cet appareil.</div>`,m=>{data.profile=m.querySelector('#profileSelect').value;save();renderNav();renderPage();toast('Profil mis à jour')},'Choisir')}
function searchModal(){let m=$('#modal');m.innerHTML=`<div class="sectionhead"><h2>Rechercher dans Yurei</h2><button class="btn" data-close>Fermer</button></div><div class="field"><input id="globalSearch" placeholder="Joueur, map, exercice, adversaire…" autofocus></div><div id="searchResults" class="grid" style="gap:6px"><div class="empty">Écris pour rechercher dans les pages et les contenus.</div></div>`;$('#overlay').classList.add('show');m.querySelector('[data-close]').onclick=closeModal;let input=m.querySelector('#globalSearch');input.oninput=()=>{let q=input.value.trim().toLowerCase(),results=[];if(q){players.filter(p=>(p.name+' '+p.role).toLowerCase().includes(q)).forEach(p=>results.push({label:`Joueur · ${p.name} · ${p.role}`,action:()=>playerModal(p.id)}));maps.filter(x=>x.toLowerCase().includes(q)).forEach(x=>results.push({label:`Map · ${x} · stratégies et callouts`,action:()=>mapModal(x)}));sampleMatchRows().filter(x=>x.team.toLowerCase().includes(q)).forEach(x=>results.push({label:`Match · ${x.team} · ${x.map} · ${x.ours}–${x.theirs}`,action:()=>matchModal(x.id)}));data.exercises.filter(x=>x.name.toLowerCase().includes(q)).forEach(x=>results.push({label:`Training · ${x.name}`,action:()=>{closeModal();go('Training')}}))}m.querySelector('#searchResults').innerHTML=results.length?results.map((x,i)=>`<button class="btn" data-search-result="${i}" style="text-align:left">${esc(x.label)}</button>`).join(''):'<div class="empty">Aucun résultat.</div>';m.querySelectorAll('[data-search-result]').forEach(b=>b.onclick=()=>results[Number(b.dataset.searchResult)].action())};input.focus()}
const matchModalDetail=matchModal;matchModal=function(id){matchModalDetail(id);let custom=data.matches.find(x=>x.id===id);if(custom){let card=$('#modal').querySelector('.scoretable')?.closest('.card');if(card){if(!Array.isArray(custom.scoreboard)||!custom.scoreboard.length){card.innerHTML='<div class="sectionhead"><h2>Scoreboard</h2></div><div class="empty">Aucun scoreboard saisi pour ce match. Les statistiques fictives ne sont pas affichées.</div>'}else{let body=card.querySelector('tbody');if(body)body.innerHTML=custom.scoreboard.map(s=>`<tr><td>${esc(player(s.playerId).name)}</td><td>${s.k}</td><td>${s.d}</td><td>${s.a}</td><td>${s.adr}</td><td>${s.d?Number(s.k/s.d).toFixed(2):'—'}</td></tr>`).join('')}}let foot=document.createElement('div');foot.className='modalfoot';foot.innerHTML='<button class="btn" id="deleteMatch">Supprimer ce match</button>';$('#modal').append(foot);$('#deleteMatch').onclick=()=>{data.matches=data.matches.filter(x=>x.id!==id);save();closeModal();renderPage();toast('Match supprimé')}}};

async function uploadMediaFile(map,group,title,file){if(!serverUser?.teamId)throw Error('Équipe non connectée');let ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');let path=`${serverUser.teamId}/maps/${encodeURIComponent(map)}/${group}/${crypto.randomUUID()}.${ext}`;let{error}=await window.yureiSupabase.storage.from('redline-team-media').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});if(error)throw error;return{mediaId:path,storagePath:path,title,fileName:file.name}}async function downloadLocalBackup(){try{let files=[];for(let[map,groups]of Object.entries(data.mapMedia||{}))for(let group of ['lineups','callouts'])for(let item of groups?.[group]||[]){try{let blob=await mediaOp('readonly',item.mediaId);if(!blob)continue;let bytes=new Uint8Array(await blob.arrayBuffer()),binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));files.push({map,group,mediaId:item.mediaId,title:item.title,fileName:item.fileName||'media',mime:blob.type||'application/octet-stream',data:btoa(binary)})}catch(e){console.warn('Sauvegarde média',e)}}let backup=new Blob([JSON.stringify({version:1,createdAt:new Date().toISOString(),data,media:files})],{type:'application/json'}),url=URL.createObjectURL(backup),a=document.createElement('a');a.href=url;a.download='redline-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);document.querySelector('#authError').textContent='Sauvegarde téléchargée. Importe ce fichier lors de la configuration du serveur.'}catch(e){document.querySelector('#authError').textContent='Export impossible : '+e.message}}
async function migrateLocalMedia(){for(let [map,groups] of Object.entries(data.mapMedia||{}))for(let group of ['lineups','callouts'])for(let item of groups?.[group]||[]){try{let file=await mediaOp('readonly',item.mediaId);if(!file)continue;let uploaded=await uploadMediaFile(map,group,item.title,file);item.mediaId=uploaded.mediaId;item.fileName=uploaded.fileName}catch(e){console.warn('Migration média',e)}}}

function primitiveMetrics(obj,prefix='',max=36){let out=[];function walk(v,path,depth){if(out.length>=max||depth>3||v===null||v===undefined)return;if(typeof v!=='object'){out.push([path,String(v)]);return}if(Array.isArray(v)){v.slice(0,10).forEach((x,i)=>walk(x,`${path} · ${x?.label||x?.mode||i+1}`,depth+1));return}for(const [k,x] of Object.entries(v)){if(['id','steam64_id','steam_id_64','player_id','avatar','faceit_url','profile_url','steam_id','privacy_mode'].includes(k.toLowerCase()))continue;walk(x,path?`${path} · ${k}`:k,depth+1);if(out.length>=max)break}}walk(obj,prefix,0);return out}

    const installButton = section.querySelector('#desktopInstallUpdate');
    const paint = status => {
      if (!section.isConnected) return;
      const labels = { idle: 'Prêt à vérifier les mises à jour.', checking: 'Recherche d’une mise à jour…', available: `Version ${status.version} trouvée. Téléchargement…`, downloading: `Téléchargement de la mise à jour : ${status.percent ?? 0} %`, downloaded: `La version ${status.version} est prête à être installée.`, current: `L’application est à jour (version ${status.version}).`, unavailable: status.message || 'La recherche est disponible dans la version installée.', error: `Mise à jour impossible : ${status.message || 'erreur inconnue'}` };
      statusNode.textContent = labels[status.state] || labels.idle;
      installButton.hidden = status.state !== 'downloaded';
    };
    const version = await window.yureiDesktop.getVersion();
    section.querySelector('#desktopAppVersion').textContent = `Version installée : ${version}`;
    paint(await window.yureiDesktop.getUpdateStatus());
    updateStatusUnsubscribe = window.yureiDesktop.onUpdateStatus(paint);
    section.querySelector('#desktopCheckUpdate').onclick = async event => {
      event.currentTarget.disabled = true;
      paint({ state: 'checking' });
      paint(await window.yureiDesktop.checkForUpdates());
      event.currentTarget.disabled = false;
    };
    installButton.onclick = () => window.yureiDesktop.installUpdate();
  };
}
await bootSupabase();
})();
</script></body></html>
