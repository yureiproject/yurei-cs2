name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          "value=$appVersion" >> $env:GITHUB_OUTPUT
      - name: Create release tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: v${{ steps.version.outputs.value }}
        with:
          script: |
            const ref = `refs/tags/${process.env.RELEASE_TAG}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              core.info(`${ref} already exists; the release assets will be refreshed.`);
            }
      - name: Build Windows installer
        run: npm run dist:win
      - name: Attach installer and auto-update metadata to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Yurei v${{ steps.version.outputs.value }}
          files: release/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

