name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check tag matches app version
        shell: pwsh
        run: |
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$appVersion" -ne $env:TAG_NAME) {
            throw "Tag $env:TAG_NAME must match package.json version v$appVersion"
          }
        env:
          TAG_NAME: ${{ github.ref_name }}
      - name: Build Windows installer
        run: npm run dist:win
      - name: Attach installer and auto-update metadata to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yurei ${{ github.ref_name }}
          files: release/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
